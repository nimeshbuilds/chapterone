<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' data: blob:; script-src 'self'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none';" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>ChapterOne — Your Personal Book Writer</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">1</div>
        <div class="brand-text">
          <strong>ChapterOne</strong>
          <span>A little space for big ideas</span>
        </div>
      </div>
      <nav class="nav" aria-label="Main navigation">
        <span class="nav-label">YOUR WORKSPACE</span>
        <button class="nav-item" data-view="library">
          <span class="nav-ico" aria-hidden="true">▤</span> Library
        </button>
        <button class="nav-item" data-view="create">
          <span class="nav-ico" aria-hidden="true">＋</span> New Book
        </button>
        <button class="nav-item" data-view="kids">
          <span class="nav-ico" aria-hidden="true">☆</span> Kids Books
        </button>
        <button class="nav-item" data-view="settings">
          <span class="nav-ico" aria-hidden="true">⚙</span> Settings
        </button>
      </nav>
      <div class="sidebar-foot">
        <a class="handbook-link" href="https://nimeshbuilds.github.io/chapterone/">Writing handbook <span aria-hidden="true">↗</span></a>
        <p class="sidebar-note">Your library stays on this device.<br>AI writing uses your providers.</p>
        <div id="provider-pill" class="pill">Checking…</div>
      </div>
    </aside>

    <main class="content">
      <div id="prereq-banner" class="banner hidden"></div>
      <div id="view-root"></div>
    </main>
  </div>

  <div id="toast" class="toast hidden" role="status" aria-live="polite" aria-atomic="true"></div>

  <script src="app.js"></script>
</body>
</html>
