name: Release

# Push a version tag (e.g. v0.1.1) to build, sign, notarize, and publish a
# warning-free macOS DMG. All Apple credentials come from repo secrets — see
# SIGNING.md ("CI / GitHub Actions").
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # needed to create the GitHub Release

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build, sign & notarize (universal DMG)
        env:
          # Developer ID Application cert, exported as a base64 .p12 + its password.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # Notarization (notarytool) credentials.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run dist:mac

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ChapterOne ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/*-universal.dmg
            release/*-universal-mac.zip
