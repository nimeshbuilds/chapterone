name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Run test suite
        run: npm test

  audit:
    name: Dependency security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      # Fail the build on a high/critical vulnerability in anything that ships
      # in the app. Build-only devDependencies (the electron-builder toolchain)
      # are tracked separately by Dependabot.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
