name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Desktop (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mac-intel
            os: macos-15-intel
            build: npm run dist:mac:x64 -- --publish never
            app: release/mac/ChapterOne.app/Contents/Resources/app.asar
          - name: mac-universal
            os: macos-15
            build: npm run dist:mac -- --publish never
            app: release/mac-universal/ChapterOne.app/Contents/Resources/app.asar
          - name: windows-x64
            os: windows-latest
            build: npm run dist:win:x64 -- --publish never
            app: release/win-unpacked/resources/app.asar
            executable: release/win-unpacked/ChapterOne.exe
          - name: windows-arm64
            os: windows-11-arm
            build: npm run dist:win:arm64 -- --publish never
            app: release/win-arm64-unpacked/resources/app.asar
            executable: release/win-arm64-unpacked/ChapterOne.exe
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Verify smoke runner failure detection
        run: npm run test:smoke -- --self-test
      - run: npm run test:smoke
      - name: Build installers
        run: ${{ matrix.build }}
      - name: Verify unsigned Windows test artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          APP_EXECUTABLE: ${{ matrix.executable }}
        run: |
          $files = @(Get-Item -LiteralPath $env:APP_EXECUTABLE -ErrorAction Stop)
          $installers = @(Get-ChildItem release/*.exe -ErrorAction Stop)
          if ($installers.Count -ne 1) { throw 'Expected exactly one Windows installer.' }
          $files += $installers
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature -LiteralPath $file.FullName
            if ($signature.Status -ne 'NotSigned') { throw "Expected an unsigned CI artifact: $($file.Name) ($($signature.Status))" }
            Write-Output "Verified unsigned status: $($file.Name)"
          }
      - name: Smoke test packaged application code
        run: npm run test:smoke -- --app-root=${{ matrix.app }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installers-${{ matrix.name }}
          if-no-files-found: error
          retention-days: 14
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: smoke-${{ matrix.name }}
          path: artifacts/
          if-no-files-found: ignore

  unit-linux:
    name: Unit tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Electron ships in the app even though npm calls it a devDependency.
      - run: npm run verify
