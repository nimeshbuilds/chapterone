name: CodeQL

# Static application security testing (SAST). Free on public repositories;
# on a private repo it requires GitHub Advanced Security.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '27 6 * * 1' # weekly, Mondays

jobs:
  analyze:
    name: Analyze (JavaScript)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-and-quality
      # Publishing results to the Security tab needs a public repo (free) or
      # GitHub Advanced Security. Until then, don't fail the build on the upload
      # step — the analysis still runs on every push/PR.
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        continue-on-error: true
