version: 2
updates:
  # App + build dependencies
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development

  # Keep the GitHub Actions themselves up to date
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
